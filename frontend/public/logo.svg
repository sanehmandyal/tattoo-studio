<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B77D"/>
      <stop offset="50%" stop-color="#C1A27B"/>
      <stop offset="100%" stop-color="#8E6A3E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D1F"/>
      <stop offset="100%" stop-color="#0E1213"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Atelier Emblem Base -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#A7835D" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Divine Devbhoomi Sun Rays -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="18" x2="100" y2="28" />
    <line x1="100" y1="172" x2="100" y2="182" />
    <line x1="18" y1="100" x2="28" y2="100" />
    <line x1="172" y1="100" x2="182" y2="100" />
    <line x1="42" y1="42" x2="50" y2="50" />
    <line x1="158" y1="158" x2="150" y2="150" />
    <line x1="42" y1="158" x2="50" y2="150" />
    <line x1="158" y1="42" x2="150" y2="50" />
  </g>

  <!-- Sacred Trishul & Geometric Tattoo Emblem -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <!-- Central Spearhead -->
    <path d="M100 32 L106 62 L100 58 L94 62 Z" />
    <line x1="100" y1="58" x2="100" y2="148" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Crescent Blade -->
    <path d="M72 48 C72 74 94 82 96 84 C90 76 80 68 80 50 C80 44 76 40 72 48 Z" />
    
    <!-- Right Crescent Blade -->
    <path d="M128 48 C128 74 106 82 104 84 C110 76 120 68 120 50 C120 44 124 40 128 48 Z" />
    
    <!-- Sacred Damru / Geometric Ring -->
    <polygon points="90,105 110,105 92,125 108,125" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="100" cy="115" r="3" fill="#E2B77D" />

    <!-- Lotus Base Petals -->
    <path d="M100 152 C85 140 75 145 70 155 C82 155 95 150 100 152 Z" opacity="0.85"/>
    <path d="M100 152 C115 140 125 145 130 155 C118 155 105 150 100 152 Z" opacity="0.85"/>
  </g>

  <!-- Sacred Devbhoomi Stars -->
  <circle cx="100" cy="168" r="3" fill="#E2B77D"/>
  <circle cx="68" cy="100" r="2" fill="#E2B77D" opacity="0.7"/>
  <circle cx="132" cy="100" r="2" fill="#E2B77D" opacity="0.7"/>
</svg>
